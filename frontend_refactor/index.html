<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Parliament</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-serif { font-family: 'Merriweather', serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    
    /* Hide scrollbar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Custom Animation Definitions */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideInRight { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideInUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 5px rgba(255, 107, 0, 0.2); } 50% { box-shadow: 0 0 20px rgba(255, 107, 0, 0.6); } }
    @keyframes dash { to { stroke-dashoffset: 0; } }
    @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
    
    .animate-in { animation-fill-mode: both; }
    .fade-in { animation-name: fadeIn; }
    .slide-in-from-right-4 { animation-name: slideInRight; }
    .slide-in-from-bottom-4 { animation-name: slideInUp; }
    .duration-500 { animation-duration: 500ms; }
    .duration-700 { animation-duration: 700ms; }

    /* Tactical Textures */
    .bg-dot-pattern {
      background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
      background-size: 4px 4px;
    }
    .bg-grid-pattern {
      background-size: 40px 40px;
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    }
    .bg-stripe-pattern {
      background-image: repeating-linear-gradient(
        45deg,
        rgba(0, 0, 0, 0.2),
        rgba(0, 0, 0, 0.2) 5px,
        transparent 5px,
        transparent 10px
      );
    }
  </style>

}

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流式思考显示测试</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --text-primary: #e8e8ed;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;
            --accent-purple: #8b5cf6;
            --accent-purple-glow: rgba(139, 92, 246, 0.3);
            --accent-cyan: #06b6d4;
            --accent-green: #22c55e;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 1.75rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .chat-container {
            flex: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            padding: 1rem;
            border-radius: 0.75rem;
            max-width: 90%;
        }

        .message.user {
            align-self: flex-end;
            background: var(--accent-purple);
            color: white;
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
        }

        /* 思考过程容器 */
        .thinking-container {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-purple);
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }

        .thinking-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            color: var(--accent-purple);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .thinking-header .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid var(--accent-purple-glow);
            border-top-color: var(--accent-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .thinking-bullets {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* 单个思考步骤 */
        .thinking-bullet {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border-color);
            animation: fadeIn 0.3s ease-out;
        }

        .thinking-bullet:last-child {
            border-bottom: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .thinking-bullet .title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .thinking-bullet .title::before {
            content: "•";
            color: var(--accent-green);
            font-weight: bold;
        }

        .thinking-bullet.active .title::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent-cyan);
            border-radius: 50%;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        .thinking-bullet .detail {
            margin-left: 1rem;
            padding-left: 0.75rem;
            border-left: 2px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.875rem;
            line-height: 1.5;
        }

        /* 最终答案 */
        .final-answer {
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* 输入区域 */
        .input-area {
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 0.75rem;
        }

        .input-area input {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-size: 0.9375rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-area input:focus {
            border-color: var(--accent-purple);
        }

        .input-area input::placeholder {
            color: var(--text-muted);
        }

        .input-area button {
            background: var(--accent-purple);
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .input-area button:hover {
            background: #7c3aed;
            transform: translateY(-1px);
        }

        .input-area button:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        /* 状态指示器 */
        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .status.connecting {
            color: var(--accent-cyan);
        }

        .status.error {
            color: #ef4444;
        }

        /* 模型选择器 */
        .model-selector {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .model-selector select {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            padding: 0.375rem 0.5rem;
            color: var(--text-primary);
            font-size: 0.8rem;
            outline: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>🧠 流式思考显示测试</h1>
            <p>OpenAI 方案：使用虚拟工具 emit_thinking 实现实时思考过程展示</p>
        </header>

        <div class="chat-container">
            <div class="model-selector">
                <label>模型：</label>
                <select id="modelSelect">
                    <option value="nvidia/nemotron-3-nano-30b-a3b:free">Nemotron 3 Nano 30B (Free)</option>
                    <option value="nvidia/nemotron-nano-12b-v2-vl:free">Nemotron Nano 12B VL (Free)</option>
                    <option value="allenai/olmo-3.1-32b-think:free">OLMo 3.1 32B Think (Free)</option>
                    <option value="tngtech/deepseek-r1t-chimera:free">DeepSeek R1T Chimera (Free)</option>
                    <option value="nvidia/nemotron-nano-9b-v2:free">Nemotron Nano 9B (Free)</option>
                    <option value="tngtech/tng-r1t-chimera:free">TNG R1T Chimera (Free)</option>
                    <option value="z-ai/glm-4.5-air:free">GLM 4.5 Air (Free)</option>
                    <option value="openai/gpt-oss-120b:free">GPT-OSS 120B (Free)</option>
                    <option value="tngtech/deepseek-r1t2-chimera:free">DeepSeek R1T2 Chimera (Free)</option>
                    <option value="xiaomi/mimo-v2-flash:free">Mimo V2 Flash (Free)</option>
                    <option value="deepseek/deepseek-r1-0528:free">DeepSeek R1 0528 (Free)</option>
                </select>
            </div>

            <div class="messages" id="messages">
                <div class="message assistant">
                    <p>你好！我是带有流式思考功能的 AI 助手。问我任何问题，你将看到我的思考过程实时展示。</p>
                </div>
            </div>

            <div class="status" id="status"></div>

            <div class="input-area">
                <input type="text" id="userInput" placeholder="输入你的问题..." autofocus>
                <button id="sendBtn">发送</button>
            </div>
        </div>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusEl = document.getElementById('status');
        const modelSelect = document.getElementById('modelSelect');

        let isStreaming = false;

        function setStatus(text, className = '') {
            statusEl.textContent = text;
            statusEl.className = 'status ' + className;
        }

        function addMessage(content, isUser = false) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'assistant'}`;
            div.innerHTML = `<p>${escapeHtml(content)}</p>`;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return div;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function createThinkingContainer() {
            const container = document.createElement('div');
            container.className = 'thinking-container';
            container.innerHTML = `
                <div class="thinking-header">
                    <div class="spinner"></div>
                    <span>正在思考...</span>
                </div>
                <div class="thinking-bullets"></div>
            `;
            messagesEl.appendChild(container);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return container;
        }

        function addThinkingBullet(container, title, detail, bulletId) {
            const bullets = container.querySelector('.thinking-bullets');

            // 检查是否已存在相同 bulletId
            let bullet = bullets.querySelector(`[data-bullet-id="${bulletId}"]`);

            if (!bullet) {
                bullet = document.createElement('div');
                bullet.className = 'thinking-bullet active';
                bullet.dataset.bulletId = bulletId;
                bullets.appendChild(bullet);
            }

            bullet.innerHTML = `
                <div class="title">${escapeHtml(title)}</div>
                ${detail ? `<div class="detail">${escapeHtml(detail)}</div>` : ''}
            `;

            messagesEl.scrollTop = messagesEl.scrollHeight;
            return bullet;
        }

        function finalizeThinking(container) {
            const header = container.querySelector('.thinking-header');
            header.innerHTML = `
                <span style="color: var(--accent-green)">✓</span>
                <span>思考完成</span>
            `;

            // 移除所有 active 状态
            container.querySelectorAll('.thinking-bullet.active').forEach(b => {
                b.classList.remove('active');
            });
        }

        function createAnswerContainer() {
            const container = document.createElement('div');
            container.className = 'message assistant';
            container.innerHTML = `<div class="final-answer"></div>`;
            messagesEl.appendChild(container);
            return container;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message || isStreaming) return;

            isStreaming = true;
            sendBtn.disabled = true;
            userInput.value = '';

            // 添加用户消息
            addMessage(message, true);

            // 创建思考容器
            let thinkingContainer = null;
            let answerContainer = null;
            let answerEl = null;
            let hasStartedContent = false; // 跟踪是否已经开始输出有效内容

            try {
                setStatus('连接中...', 'connecting');

                const response = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        model: modelSelect.value
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                setStatus('接收中...', 'connecting');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });

                    // 解析 SSE 事件
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;

                        try {
                            const event = JSON.parse(line.slice(6));

                            switch (event.type) {
                                case 'thinking':
                                    // 确保思考容器优先创建
                                    if (!thinkingContainer) {
                                        thinkingContainer = createThinkingContainer();
                                    }
                                    addThinkingBullet(
                                        thinkingContainer,
                                        event.title,
                                        event.detail,
                                        event.bullet_id
                                    );
                                    setStatus(`思考中: ${event.title}`, 'connecting');
                                    break;

                                case 'content':
                                    // 无论先收到什么，都确保思考容器先创建
                                    if (!thinkingContainer) {
                                        thinkingContainer = createThinkingContainer();
                                    }
                                    // 然后创建答案容器
                                    if (!answerContainer) {
                                        answerContainer = createAnswerContainer();
                                        answerEl = answerContainer.querySelector('.final-answer');
                                    }

                                    // 过滤多余的空白字符（特别是开头的大量空行和连续空行）
                                    let content = event.delta;

                                    // 处理初始内容的空白过滤
                                    if (!hasStartedContent) {
                                        if (content.trim() === '') {
                                            // 纯空白，跳过
                                            break;
                                        } else {
                                            // 找到有效内容的开始位置
                                            const firstNonWhitespaceIndex = content.search(/\S/);
                                            if (firstNonWhitespaceIndex >= 0) {
                                                // 只取有效内容部分
                                                content = content.substring(firstNonWhitespaceIndex);
                                                hasStartedContent = true;
                                            } else {
                                                // 仍然没有有效内容，跳过
                                                break;
                                            }
                                        }
                                    }

                                    // 确保内容非空
                                    if (!content) {
                                        break;
                                    }

                                    // 获取当前已有的内容
                                    let currentText = answerEl.textContent;

                                    // 过滤连续空行：如果当前内容以换行结尾，且新内容以换行开始，只保留一个换行
                                    if (currentText.endsWith('\n') && content.startsWith('\n')) {
                                        // 只保留新内容中的非初始换行部分
                                        content = content.replace(/^\n+/, '');
                                    }

                                    // 如果内容非空，则追加
                                    if (content) {
                                        answerEl.textContent += content;

                                        // 后处理：将多个连续换行替换为单个换行
                                        let finalText = answerEl.textContent;
                                        // 将两个或多个连续换行替换为单个换行
                                        finalText = finalText.replace(/\n\s*\n+/g, '\n\n');
                                        // 如果需要更严格的控制，将所有连续换行替换为单个换行
                                        // finalText = finalText.replace(/\n+/g, '\n');

                                        // 更新处理后的内容
                                        if (finalText !== answerEl.textContent) {
                                            answerEl.textContent = finalText;
                                        }

                                        messagesEl.scrollTop = messagesEl.scrollHeight;
                                        setStatus('生成中...', 'connecting');
                                    }
                                    break;

                                case 'done':
                                    // 无论是否有思考容器，都结束思考状态
                                    if (thinkingContainer) {
                                        finalizeThinking(thinkingContainer);
                                    }
                                    setStatus('');
                                    break;

                                case 'error':
                                    setStatus(`错误: ${event.message}`, 'error');
                                    break;
                            }
                        } catch (e) {
                            console.error('Parse error:', e, line);
                        }
                    }
                }

                // 安全保障：如果流结束但没有收到done事件，手动结束
                if (thinkingContainer && !thinkingContainer.querySelector('.thinking-header').textContent.includes('完成')) {
                    finalizeThinking(thinkingContainer);
                    setStatus('');
                }

            } catch (error) {
                setStatus(`错误: ${error.message}`, 'error');
                console.error('Stream error:', error);
            } finally {
                isStreaming = false;
                sendBtn.disabled = false;
                setStatus('');
            }
        }

        // 事件绑定
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>

</html>

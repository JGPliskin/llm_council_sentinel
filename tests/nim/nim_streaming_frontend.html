<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIM Streaming Thinking Test</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --text-primary: #e8e8ed;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;
            --accent-green: #76b900; /* NVIDIA Greenish */
            --accent-green-glow: rgba(118, 185, 0, 0.3);
            --accent-blue: #3b82f6;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        header { text-align: center; margin-bottom: 2rem; }
        header h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .chat-container {
            flex: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 70vh;
        }
        .model-selector {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-tertiary);
        }
        .model-selector select {
            width: 100%;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            border-radius: 0.5rem;
            outline: none;
            cursor: pointer;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .message {
            max-width: 90%;
            padding: 1rem;
            border-radius: 0.75rem;
            line-height: 1.6;
        }
        .message.user {
            align-self: flex-end;
            background: var(--accent-blue);
            color: white;
            border-bottom-right-radius: 0.1rem;
        }
        .message.assistant {
            align-self: flex-start;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 0.1rem;
        }
        
        /* Thinking Styles */
        .thinking-container {
            margin-bottom: 1rem;
            border-left: 2px solid var(--accent-green);
            background: rgba(118, 185, 0, 0.05);
            border-radius: 0.5rem;
            padding: 0.75rem;
            font-size: 0.9rem;
        }
        .thinking-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent-green);
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .thinking-bullet {
            margin-bottom: 0.5rem;
            padding-left: 0.5rem;
        }
        .thinking-bullet .title {
            font-weight: 500;
            color: var(--text-primary);
        }
        .thinking-bullet .detail {
            color: var(--text-secondary);
            margin-top: 0.2rem;
            font-size: 0.85rem;
            white-space: pre-wrap;
        }
        
        /* Input Area */
        .input-area {
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 1rem;
            background: var(--bg-tertiary);
        }
        .input-area input {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            background: var(--bg-primary);
            color: white;
            outline: none;
        }
        .input-area button {
            padding: 0 1.5rem;
            background: var(--accent-green);
            color: black;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
        }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Markdown generated content */
        .final-answer p { margin-bottom: 0.5rem; }
        .final-answer pre {
            background: #000;
            padding: 0.5rem;
            border-radius: 0.3rem;
            overflow-x: auto;
            margin: 0.5rem 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>⚡ NIM Streaming Thinking</h1>
            <p>Visualizing <code>emit_thinking</code> tools & native <code>reasoning_content</code></p>
        </header>

        <div class="chat-container">
            <div class="model-selector">
                <select id="modelSelect">
                    <option value="deepseek-ai/deepseek-v3.1">1. deepseek-ai/deepseek-v3.1</option>
                    <option value="deepseek-ai/deepseek-v3.1-terminus">2. deepseek-ai/deepseek-v3.1-terminus</option>
                    <option value="deepseek-ai/deepseek-r1">3. deepseek-ai/deepseek-r1</option>
                    <option value="meta/llama-3.3-70b-instruct">4. meta/llama-3.3-70b-instruct</option>
                    <option value="nvidia/llama-3.3-nemotron-super-49b-v1">5. nvidia/llama-3.3-nemotron-super-49b-v1</option>
                    <option value="nvidia/cosmos-reason2-8b">6. nvidia/cosmos-reason2-8b</option>
                    <option value="mistralai/mixtral-8x22b-instruct-v0.1">7. mistralai/mixtral-8x22b-instruct-v0.1</option>
                    <option value="google/gemma-3-27b-it">8. google/gemma-3-27b-it</option>
                    <option value="openai/gpt-oss-120b">9. openai/gpt-oss-120b</option>
                    <option value="moonshotai/kimi-k2-instruct-0905">10. moonshotai/kimi-k2-instruct-0905</option>
                    <option value="qwen/qwen2.5-coder-32b-instruct">11. qwen/qwen2.5-coder-32b-instruct</option>
                    <option value="nvidia/nemotron-3-nano-30b-a3b">12. nvidia/nemotron-3-nano-30b-a3b</option>
                    <option value="minimaxai/minimax-m2.1">13. minimaxai/minimax-m2.1</option>
                    <option value="z-ai/glm4.7">14. z-ai/glm4.7</option>
                </select>
            </div>

            <div class="messages" id="messages">
                <div class="message assistant">
                    Hello! Select a model and I'll show you how it thinks.
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="userInput" placeholder="Ask a complex question..." autofocus>
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const modelSelect = document.getElementById('modelSelect');

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            if (role === 'assistant') {
                div.innerHTML = `<div class="final-answer">${text || ''}</div>`;
            } else {
                div.textContent = text;
            }
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return div;
        }

        function createThinkingContainer() {
            const container = document.createElement('div');
            container.className = 'thinking-container';
            container.innerHTML = `
                <div class="thinking-header">
                    <span>Checking Thoughts...</span>
                </div>
                <div class="thinking-bullets"></div>
            `;
            // Insert before the last message if exists, or append?
            // Usually thinking comes before answer.
            // We'll append it to messages area.
            messagesEl.appendChild(container);
            return container;
        }

        function updateThinkingBullet(container, bulletId, title, detail, op) {
            const bulletsArea = container.querySelector('.thinking-bullets');
            let bullet = bulletsArea.querySelector(`[data-id="${bulletId}"]`);
            
            if (!bullet) {
                bullet = document.createElement('div');
                bullet.className = 'thinking-bullet';
                bullet.dataset.id = bulletId;
                bulletsArea.appendChild(bullet);
            }
            
            // If op is update or append, we just set content for now.
            // Simplified logic: always overwrite title, overwrite detail or append?
            // Python backend sends full detail for native reasoning (op='update'), 
            // but might use append for others.
            
            if (title) {
                bullet.innerHTML = `<div class="title">${title}</div>`; // Re-render title
            }
            
            // If detail is present
            if (detail) {
                // If existing detail div
                let detailDiv = bullet.querySelector('.detail');
                if (!detailDiv) {
                    detailDiv = document.createElement('div');
                    detailDiv.className = 'detail';
                    bullet.appendChild(detailDiv);
                }
                
                if (op === 'append') {
                    // Be careful not to double append if backend sends full buffer?
                    // The reference backend logic was: emit_thinking is ATOMIC step.
                    // But for native reasoning I used logic that sends FULL buffer.
                    // Let's assume detail is the FULL content for 'update' and 'append' 
                    // in my specific backend implementation for native reasoning.
                    // Wait, in backend:
                    // Native: op='update', detail=native_reasoning_buffer (FULL) -> So innerText = detail.
                    // Tool: op=args.get('op'), detail=args.get('detail'). usually full string for that step.
                    detailDiv.textContent = detail; 
                } else {
                    detailDiv.textContent = detail;
                }
            }
            
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // UI Reset
            userInput.value = '';
            
            appendMessage('user', text);
            
            // Create Placeholders
            let thinkingContainer = null;
            let assistantMsgDiv = null;
            let finalAnswerDiv = null;

            try {
                const response = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        model: modelSelect.value
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.slice(6));
                            
                            if (data.type === 'thinking') {
                                if (!thinkingContainer) {
                                    thinkingContainer = createThinkingContainer();
                                }
                                updateThinkingBullet(
                                    thinkingContainer, 
                                    data.bullet_id, 
                                    data.title, 
                                    data.detail, 
                                    data.op
                                );
                            } else if (data.type === 'content') {
                                if (!assistantMsgDiv) {
                                    assistantMsgDiv = appendMessage('assistant', '');
                                    finalAnswerDiv = assistantMsgDiv.querySelector('.final-answer');
                                }
                                finalAnswerDiv.textContent += data.delta;
                                messagesEl.scrollTop = messagesEl.scrollHeight;
                            } else if (data.type === 'error') {
                                alert('Error: ' + data.message);
                            } else if (data.type === 'done') {
                                if (thinkingContainer) {
                                    thinkingContainer.querySelector('.thinking-header span').textContent = 'Thinking Complete';
                                    thinkingContainer.querySelector('.thinking-header').style.color = '#888';
                                }
                            }
                        }
                    }
                }

            } catch (err) {
                console.error(err);
                appendMessage('assistant', 'System Error: ' + err.message);
            }
        }

        sendBtn.onclick = sendMessage;
        userInput.onkeypress = (e) => {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>

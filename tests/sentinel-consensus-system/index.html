<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Sentinel Consensus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #050510;
        color: #e0f2fe;
        overflow: hidden; /* Prevent scroll on main body, handle in app */
      }
      
      /* Custom Animations for that Scifi feel */
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }
      
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.8; box-shadow: 0 0 10px rgba(6, 182, 212, 0.5); }
        50% { opacity: 1; box-shadow: 0 0 20px rgba(6, 182, 212, 0.9); }
      }

      @keyframes grid-move {
        0% { background-position: 0 0; }
        100% { background-position: 50px 50px; }
      }

      .font-orbitron { font-family: 'Orbitron', sans-serif; }
      .font-rajdhani { font-family: 'Rajdhani', sans-serif; }

      /* Utility class for the chamfered corner look */
      .clip-corner-top-right {
        clip-path: polygon(0 0, 95% 0, 100% 15px, 100% 100%, 0 100%);
      }
      .clip-corner-both {
        clip-path: polygon(
          10px 0, 100% 0, 
          100% calc(100% - 10px), calc(100% - 10px) 100%, 
          0 100%, 0 10px
        );
      }
      
      .tech-border {
        position: relative;
      }
      .tech-border::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border: 1px solid rgba(6, 182, 212, 0.3);
        pointer-events: none;
      }
      
      /* Scrollbar hiding */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mission Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              hud: {
                bg: '#050a14',
                'bg-soft': '#0a0f1e',
                cyan: '#06b6d4',
                'cyan-soft': 'rgba(6, 182, 212, 0.2)',
                amber: '#f59e0b',
                text: '#e0f2fe',
                muted: '#5b6b7a',
              }
            },
            fontFamily: {
              orbitron: ['Orbitron', 'sans-serif'],
              rajdhani: ['Rajdhani', 'sans-serif'],
              mono: ['Share Tech Mono', 'monospace'],
            },
            boxShadow: {
              'cyan-glow': '0 0 15px rgba(6, 182, 212, 0.5)',
              'cyan-glow-sm': '0 0 8px rgba(6, 182, 212, 0.4)',
            },
            keyframes: {
              zoomIn: {
                '0%': { opacity: '0', transform: 'scale(0.8)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              }
            },
            animation: {
                'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                'zoom-in': 'zoomIn 0.2s ease-out forwards',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #050a14;
        color: #e0f2fe;
        overflow: hidden; 
      }
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      
      /* Custom Clip Paths for Sci-Fi shapes */
      .clip-path-chamfer {
        clip-path: polygon(
          10px 0, 100% 0, 
          100% calc(100% - 10px), calc(100% - 10px) 100%, 
          0 100%, 0 10px
        );
      }
      
      /* Updated Slant: More aggressive angle for the button */
      .clip-path-slant {
        clip-path: polygon(
          20px 0, 100% 0, 
          100% 100%, 0 100%
        );
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.330.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/index.tsx"></script>
</body>
</html>
